Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8450/Lenovo-TB320FC/HiFi.conf"
	Comment "Play and record HiFi quality Music."
}

BootSequence [
	cset "name='SPK1 Amplifier Mode' SPK"
	cset "name='SPK2 Amplifier Mode' SPK"
	cset "name='SPK1 DACPCM Source' ASP_RX1"
	cset "name='SPK2 DACPCM Source' ASP_RX2"
	cset "name='SPK1 Digital PCM Volume' 372"
	cset "name='SPK2 Digital PCM Volume' 372"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
