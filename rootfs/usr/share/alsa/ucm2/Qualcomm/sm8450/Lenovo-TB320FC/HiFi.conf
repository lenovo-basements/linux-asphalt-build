SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		# ACP probes the PCM before SectionDevice enable; DPCM needs its
		# backend route already connected. JackControl handles availability.
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='SPK1 AMP Enable Switch' 1"
		cset "name='SPK2 AMP Enable Switch' 1"
		cset "name='SPK1 DACPCM Source' ASP_RX1"
		cset "name='SPK2 DACPCM Source' ASP_RX2"
		# AudioReach volume is linear Q13: 8192 is unity, not 65535.
		# Avoid boosting/clipping in the DSP and attenuating afterwards.
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
		# -9.25 dB at the amps preserves approximately the previous net
		# gain (DSP +18.06 dB followed by amp digital -27.25 dB).
		cset "name='SPK1 Digital PCM Volume' 372"
		cset "name='SPK2 Digital PCM Volume' 372"
	]

	DisableSequence [
		cset "name='SPK1 AMP Enable Switch' 0"
		cset "name='SPK2 AMP Enable Switch' 0"
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "hw:${CardId}"
	}
}

SectionDevice."Mic" {
	Comment "Digital Microphone"

	EnableSequence [
		cset "name='VA_DEC0 Volume' 84"
		cset "name='VA_DEC1 Volume' 84"
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC0"
		cset "name='VA DMIC MUX1' DMIC1"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
	]

	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
	]

	Value {
		CaptureChannels 2
		CapturePriority 300
		CapturePCM "hw:${CardId},2"
		CaptureMixer "hw:${CardId}"
	}
}

SectionDevice."DisplayPort" {
	Comment "DisplayPort audio output"

	EnableSequence [
		cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 8192"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "hw:${CardId}"
		JackControl "DP0 Jack"
	}
}

