# Frequency floors so a 144 Hz frame never waits for schedutil or GPU devfreq
# to ramp up (the old always-on y700-performance.service values), about
# +0.2 W at idle.
# Every profile sets all floors and caps explicitly, so switching never
# depends on what tuned recorded as the "original" values.
[main]
summary=Y700: CPU and GPU frequency floors for 144 Hz / games

[sysfs]
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=2016000
/sys/devices/system/cpu/cpufreq/policy4/scaling_max_freq=2745600
/sys/devices/system/cpu/cpufreq/policy7/scaling_max_freq=3187200
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=1056000
/sys/devices/system/cpu/cpufreq/policy4/scaling_min_freq=1209600
/sys/devices/system/cpu/cpufreq/policy7/scaling_min_freq=1286400
/sys/class/devfreq/3d00000.gpu/min_freq=439000000
/sys/class/devfreq/3d00000.gpu/max_freq=900000000
