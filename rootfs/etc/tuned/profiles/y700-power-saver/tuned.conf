# Caps the big and prime clusters (and the GPU) below their high-voltage
# OPPs, where most of the energy per instruction goes.
# Every profile sets all floors and caps explicitly, so switching never
# depends on what tuned recorded as the "original" values.
[main]
summary=Y700: big/prime cluster and GPU capped below the top OPPs

[sysfs]
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=300000
/sys/devices/system/cpu/cpufreq/policy4/scaling_min_freq=633600
/sys/devices/system/cpu/cpufreq/policy7/scaling_min_freq=787200
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=2016000
/sys/devices/system/cpu/cpufreq/policy4/scaling_max_freq=1996800
/sys/devices/system/cpu/cpufreq/policy7/scaling_max_freq=2131200
/sys/class/devfreq/3d00000.gpu/min_freq=220000000
/sys/class/devfreq/3d00000.gpu/max_freq=580000000
