monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.platform-sound.HiFi__Speaker__sink"
      }
    ]
    actions = {
      update-props = {
        audioconvert.filter-graph.0 = {
          nodes = [
            { type = builtin name = left label = mixer control = { "Gain 1" = 1.0 } }
            { type = builtin name = right label = mixer control = { "Gain 1" = 1.0 } }
          ]
          inputs = [ "left:In 1" "right:In 1" ]
          outputs = [ "left:Out" "right:Out" ]
          capture.volumes = [
            { control = "left:Gain 1" min = 0.0 max = 1.0 scale = cubic }
            { control = "right:Gain 1" min = 0.0 max = 1.0 scale = cubic }
          ]
        }
      }
    }
  }
]
